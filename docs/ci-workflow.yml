# CI GitHub Actions per CassaProloco.
#
# Per attivarla, copiare questo file in `.github/workflows/ci.yml`.
# Nota: pushare file dentro `.github/workflows/` richiede che il token Git abbia
# lo scope `workflow`. Due modi:
#   - dal web: GitHub > Add file > crea `.github/workflows/ci.yml` e incolla;
#   - da CLI:  `gh auth refresh -s workflow` poi copia il file e fai push.

name: CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build and test
        run: mvn -B clean test
